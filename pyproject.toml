[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdoc"
version = "1.1.0"
description = "AI-Native Code Governance & Security Gateway"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "JACKY CHAI TZYY CHARNG", email = "jacky.chai0311@outlook.com"}
]
keywords = ["ai", "governance", "security", "code", "watchdog", "watchdoc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
watchdoc = "watchdoc.cli.main:main"

[project.urls]
Homepage = "https://github.com/JackyChai311/WatchDoc"
Documentation = "https://github.com/JackyChai311/WatchDoc#readme"
Repository = "https://github.com/JackyChai311/WatchDoc"
Issues = "https://github.com/JackyChai311/WatchDoc/issues"

[tool.setuptools]
packages = ["watchdoc", "watchdoc.wdp", "watchdoc.wgw", "watchdoc.index", "watchdoc.cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["watchdoc"]
omit = [
    "watchdoc/__pycache__/*",
    "*/__pycache__/*",
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
